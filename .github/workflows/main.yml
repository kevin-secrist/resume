on:
  pull_request:
  push:
    branches: main

permissions:
  contents: write
  packages: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    name: Build Docker Image
    outputs:
      tag: ${{ steps.select_image.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select Docker Image
        id: select_image
        shell: bash
        run: |
          ref=${{ github.ref_name }}
          status=$(git diff --exit-code origin/main Dockerfile > /dev/null && echo "unchanged" || echo "changed")
          if [[ "$ref" = "main" ]]; then
            echo "build_image=true" >> "$GITHUB_OUTPUT";
            echo "tag=latest" >> "$GITHUB_OUTPUT";
          else
            if [[ "$status" = "changed" ]]; then
              echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT";
              echo "build_image=true" >> "$GITHUB_OUTPUT";
            else
              echo "tag=latest" >> "$GITHUB_OUTPUT";
              echo "build_image=false" >> "$GITHUB_OUTPUT";
            fi;
          fi;
      - name: Login to GitHub Container Registry
        if: steps.select_image.outputs.build_image == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: steps.select_image.outputs.build_image == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        if: steps.select_image.outputs.build_image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/latex:${{ steps.select_image.outputs.tag }}

  build-documents:
    runs-on: ubuntu-latest
    needs: build-docker
    name: Build Documents
    container:
      image: ghcr.io/${{ github.repository_owner }}/latex:${{ needs.build-docker.outputs.tag }}
      options: --user 1001
    outputs:
      version: ${{ steps.version.outputs.v-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get next version
        uses: reecetech/version-increment@28d33de033e97a304f77238d6a5db26039ca15d6 # 2026.8.4
        id: version
        with:
          use_api: true
          scheme: conventional_commits
          increment: patch
      - name: Build with container
        run: ./build.sh
        working-directory: ./src
        env:
          VERSION: ${{ steps.version.outputs.v-version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: output
          path: |
            ./src/out/*.log
            ./src/out/*.pdf
  release:
    name: Release
    needs: build-documents
    environment:
      name: production
      url: https://secrist.dev/about/resume
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: output
          pattern: "*.pdf"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ needs.build-documents.outputs.version }}
          tag_name: ${{ needs.build-documents.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            secrist-resume.pdf
            secrist-cv.pdf
